<ion-header [translucent]="true">
  <ion-toolbar style="background-color: #f1f2f6;">
    <div class="headerhight">
      <ion-row class="headerw-100" >
        <ion-col size="2" routerLink="/home"><ion-icon name="chevron-back-outline"></ion-icon></ion-col>
        <ion-col size="8" class="ion-justify-content-center">
          <ion-title> Dashboard</ion-title>
        </ion-col>
        <ion-col size="2"> 
        </ion-col>
      </ion-row>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-grid class="dashboard-grid" *ngFor="let item of mydashboard">
    <h2 class="board-heading">User Board</h2>
    <ion-row class="dashboard-row">
      <ion-col size="6" class="dashboard-col">
        <ion-card (click)="next(3)" class="dashboard-card">
          <ion-card-header class="dashboard-card-header bg-Presentation">
            <ion-card-title class="dashboard-card-title">Presentation Req</ion-card-title>
            <div class="count">{{item.Presentationcount}}</div>
          </ion-card-header>
        </ion-card>
      </ion-col>

      <ion-col size="6" class="dashboard-col">
        <ion-card (click)="next(5)" class="dashboard-card">
          <ion-card-header class="dashboard-card-header bg-Brouchers">
            <ion-card-title class="dashboard-card-title">Banner Downloaded</ion-card-title>
            <div class="count">{{item.Bannercount}}</div>
          </ion-card-header>
        </ion-card>
      </ion-col>

      <ion-col size="6" class="dashboard-col">
        <ion-card (click)="next(4)" class="dashboard-card">
          <ion-card-header class="dashboard-card-header bg-Referral">
            <ion-card-title class="dashboard-card-title">Referral count</ion-card-title>
            <div class="count">{{item.Referalcount}}</div>
          </ion-card-header>
        </ion-card>
      </ion-col>

      <ion-col size="6" class="dashboard-col">
        <ion-card (click)="next(2)" class="dashboard-card">
          <ion-card-header class="dashboard-card-header bg-Brouchers">
            <ion-card-title class="dashboard-card-title">Donation</ion-card-title>
            <div class="count">{{item.Dotationcount}}</div>
          </ion-card-header>
        </ion-card>
      </ion-col>
    </ion-row>

    <div *ngIf="UserDetails && UserDetails[0] && UserDetails[0].RoleId==4 && (UserDetails[0].Rolestatus == true || UserDetails[0].Rolestatus == 'true' || UserDetails[0].Rolestatus == 1 || UserDetails[0].Rolestatus == '1')" class="mt-3">
      <h2 class="board-heading">Leader Board</h2>
      <ion-row class="dashboard-row">
        <ion-col size="6" class="dashboard-col">
          <ion-card (click)="next(1)" class="dashboard-card">
            <ion-card-header class="dashboard-card-header bg-Donors">
              <ion-card-title class="dashboard-card-title">Donors Added</ion-card-title>
              <div class="count">{{item.Adddonorscount}}</div>
            </ion-card-header>
          </ion-card>
        </ion-col>

        <ion-col size="6" class="dashboard-col">
          <ion-card (click)="next(7)" class="dashboard-card">
            <ion-card-header class="dashboard-card-header bg-Brouchers">
              <ion-card-title class="dashboard-card-title">Presentations Accepted</ion-card-title>
              <div class="count">{{item.LeadPresentationcount}}</div>
            </ion-card-header>
          </ion-card>
        </ion-col>
      </ion-row>
    </div>
  </ion-grid>
</ion-content>
