<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-row class="ion-align-items-center">
      <ion-col size="2" *ngIf="val==1">
        <ion-button fill="clear" (click)="back()" class="header-back-btn">
          <ion-icon name="chevron-back-outline" slot="icon-only"></ion-icon>
        </ion-button>
      </ion-col>
      <ion-col size="2" *ngIf="val!=1"></ion-col>
      <ion-col size="8">
        <ion-title class="page-title">GALLERY</ion-title>
      </ion-col>
      <ion-col size="2"></ion-col>
    </ion-row>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- Loading State Indicator (kept visible until API data process completes) -->
  <div *ngIf="isLoading" class="gallery-loading-state">
    <ion-spinner name="crescent" color="danger"></ion-spinner>
    <p class="loading-text">Loading gallery images...</p>
  </div>

  <!-- Gallery Content: Only logged-in user's images displayed directly -->
  <div *ngIf="!isLoading">
    <!-- Empty State if logged-in user has no gallery images -->
    <div *ngIf="(val!=1 || val==2) && (!userGalleryImages || userGalleryImages.length === 0)" class="no-records-card">
      <ion-icon name="images-outline"></ion-icon>
      <h4>No Records Found</h4>
    </div>

    <!-- Equal-sized grid layout of logged-in user's images -->
    <div *ngIf="(val!=1 || val==2) && userGalleryImages && userGalleryImages.length > 0" class="gallery_imagess">
      <div class="grid-img-wrap" *ngFor="let item of userGalleryImages" (click)="openEnlargedPreview(item.GalleryImages)">
        <div class="img-inner-wrap">
          <img [src]="getImageUrl(item.GalleryImages)" alt="Gallery Image" class="img1" loading="lazy" />
        </div>
        <button class="grid-download-btn" [disabled]="isDownloading" (click)="$event.stopPropagation(); downloadImage(item.GalleryImages)" title="Download Image" aria-label="Download Image">
          <ion-icon name="download-outline"></ion-icon>
        </button>
      </div>
    </div>

    <!-- Single View Fallback if val == 1 -->
    <div *ngIf="val==1" class="single-view-container">
      <div class="single-view-img-box" (click)="openEnlargedPreview(mygallery)">
        <img [src]="getImageUrl(mygallery)" alt="Enlarged Image" class="img2" />
      </div>
      <div class="single-view-actions">
        <ion-button fill="outline" color="danger" [disabled]="isDownloading" (click)="downloadImage(mygallery)">
          <ion-icon name="download-outline" slot="start"></ion-icon>
          Download
        </ion-button>
        <ion-button fill="solid" color="success" (click)="shareCardViaWhatsApp(mygallery)">
          <ion-icon name="arrow-redo-circle" slot="start"></ion-icon>
          Share
        </ion-button>
      </div>
    </div>
  </div>

</ion-content>

<!-- Top Download Notification Banner -->
<div *ngIf="showDownloadToast" class="download-toast" (click)="openImagePreview()">
  <img [src]="downloadedImageUrl" class="toast-thumb" alt="Downloaded Image" />
  <div class="toast-text">
    <ion-icon name="checkmark-circle" class="toast-icon"></ion-icon>
    <span>Image downloaded successfully</span>
  </div>
  <ion-icon name="close" class="toast-dismiss" (click)="dismissDownloadToast(); $event.stopPropagation()"></ion-icon>
</div>

<!-- Enlarged Image Preview Modal (occupies ~80% of screen, preserving aspect ratio, no crop/distort, clear close button) -->
<div *ngIf="showImagePreview" class="image-preview-overlay" (click)="closeImagePreview()">
  <div class="image-preview-dialog" (click)="$event.stopPropagation()">
    <!-- Clear Close (X) Button -->
    <button class="preview-close-btn" (click)="closeImagePreview()" aria-label="Close Preview">
      <ion-icon name="close"></ion-icon>
    </button>

    <!-- Enlarged Image Container -->
    <div class="preview-img-container">
      <img [src]="previewImageUrl" class="image-preview-img" alt="Enlarged Gallery Preview" />
    </div>

    <!-- Quick Actions in Enlarged Preview: Visible for normal gallery enlarged view, hidden only when opened from download-success notification -->
    <div class="preview-actions" *ngIf="!isNotificationPreview">
      <button class="preview-action-btn download-btn" [disabled]="isDownloading" (click)="$event.stopPropagation(); downloadImage(previewRawImage)">
        <ion-icon name="download-outline"></ion-icon>
        <span>Download</span>
      </button>
      <button class="preview-action-btn share-btn" (click)="shareCardViaWhatsApp(previewRawImage)">
        <ion-icon name="share-social-outline"></ion-icon>
        <span>Share</span>
      </button>
    </div>
  </div>
</div>

<!-- Bottom Navigation Footer -->
<div class="footer_content">
  <ion-row>
    <ion-col size="2.4">
      <div class="border" routerLink="/home">
        <ion-icon name="home-outline" class="tabs_icon"></ion-icon>
        <div class="tabs_title">Home</div>
      </div>
    </ion-col>
    <ion-col size="2.4">
      <div class="border" routerLink="/needblood">
        <img class="ficons" src="../../../assets/client images/All Icons/Home page Icons/Donatenowwhite.png" alt="Find donor" />
        <div class="tabs_title">Find donor</div>
      </div>
    </ion-col>
    <ion-col size="2.4">
      <div class="border" routerLink="/joincampaign">
        <img class="ficons" src="../../../assets/client images/All Icons/Home page Icons/Join Campaign.png" alt="Campaign" />
        <div class="tabs_title">Campaign</div>
      </div>
    </ion-col>
    <ion-col size="2.4" routerLink="/donorssearch">
      <div class="border">
        <img class="ficons" src="../../../assets/client images/All Icons/Home page Icons/Donate now.png" alt="Donate now" />
        <div class="tabs_title">Donate Now</div>
      </div>
    </ion-col>
    <ion-col size="2.4" routerLink="/letshlpgallerry">
      <div class="border" style="background-color:#a9b5cb;border:none">
        <img class="ficons" src="../../../assets/client images/All Icons/Home page Icons/letshlpgallerry.png" alt="Gallery" />
        <div class="tabs_title">Gallery</div>
      </div>
    </ion-col>
  </ion-row>
</div>
