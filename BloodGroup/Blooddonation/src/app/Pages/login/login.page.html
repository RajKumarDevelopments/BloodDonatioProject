<ion-content>
 
  <ng-container *ngIf="!showForgotPassword">

    <!-- Login/Signup Header -->
    <ion-row class="rows row-spacing">
      <ion-col size="6">
        <p class="header_left">LOGIN</p>
      </ion-col>
      <ion-col size="6">
        <p class="header_right" routerLink="/signup">SIGNUP</p>
      </ion-col>
    </ion-row>

    <!-- Logo and Enter Account Section -->
    <ion-row>
      <ion-col size="12" class="row-spacing">
        <div class="items_center">
          <img src="../../../assets/Images/bg_logo.png" />
        </div>
        <div class="items_center">
          <!--<h4 style="color:#6495ed59">Enter Account</h4>-->
        </div><br />

        <!-- Mobile/Email Input -->
        <div>
          <div class="items_center">
            <ion-icon name="call-outline" class="input_icon"></ion-icon>
            <input type="text" placeholder="Enter Mobile or Email" [(ngModel)]="Mobile" class="input_field" />
          </div>

          <!-- OTP Input (Mobile = 10 digits) -->
          <form (submit)="$event.preventDefault()" *ngIf="Mobile?.length === 10">
            <div class="items_center">
              <ion-icon name="lock-open-outline" class="input_icon"></ion-icon>
              <input type="text" inputmode="numeric" autocomplete="one-time-code" name="otp" id="otp" placeholder="Enter OTP" [(ngModel)]="MobileOTP" class="input_field" />
            </div>
            <div class="items_center" *ngIf="OTPFlag === 1" style="margin-top: 5px;">
              <span *ngIf="!canResend" style="color: gray; font-size: 14px;">Resend OTP in {{ resendTimer }}s</span>
              <span *ngIf="canResend" class="resend-link" style="color: red; cursor: pointer; text-decoration: underline; font-size: 14px;" (click)="SendOTPToMobile()">Resend OTP</span>
            </div>
          </form>

          <!-- Password Input (Email login: length > 12) -->
          <div class="items_center" *ngIf="Mobile?.length > 12">
            <ion-icon name="lock-open-outline" class="input_icon"></ion-icon>
            <input type="text" placeholder="Enter Password" [(ngModel)]="MobileOTP" class="input_field" />
          </div>
        </div>

        <!-- Forgot Password Link (shown whenever user is typing an email) -->
        <div class="items_center" *ngIf="Mobile?.includes('@') && !isNumeric(Mobile)">
          <span class="forgot-link" (click)="openForgotPassword()">Forgot Password?</span>
        </div>
      </ion-col>
    </ion-row>

    <!-- Main Login Action Buttons -->
    <!-- Mobile: OTP received → Login -->
    <div class="login-btn-wrapper" *ngIf="isNumeric(Mobile) && OTPFlag === 1 && Mobile?.length === 10">
      <button class="red-button" [disabled]="isSubmitting" (click)="MobileLogin()">Login</button>
    </div>

    <!-- Mobile: OTP not yet sent → Send OTP -->
    <div class="login-btn-wrapper" *ngIf="isNumeric(Mobile) && OTPFlag != 1 && Mobile?.length === 10">
      <button class="red-button" [disabled]="isSubmitting" (click)="VerifyMobileEmail()">Send OTP</button>
    </div>

    <!-- Email login → Login -->
    <div class="login-btn-wrapper" *ngIf="Mobile?.length > 12 && !isNumeric(Mobile)">
      <button class="red-button" [disabled]="isSubmitting" (click)="login()">Login</button>
    </div>

    <!-- Signup and Register Section -->
    <ion-row class="row-spacing" style="margin-top: 15px; margin-bottom: 25px;">
      <ion-col size="12">
        <div class="items_center">
          <div style="color:gray">Don't have an account?</div>
        </div>
        <div class="items_center" style="margin-top: 4px;">
          <div style="color:red; cursor: pointer; font-weight: 600;" (click)="signup()">Register and donate</div>
        </div>
      </ion-col>
    </ion-row>

  </ng-container>

  <ng-container *ngIf="showForgotPassword">

    <!-- Back Button + Title -->
    <ion-row class="rows row-spacing">
      <ion-col size="2">
        <ion-icon name="arrow-back-outline" class="back-icon" (click)="closeForgotPassword()"></ion-icon>
      </ion-col>
      <ion-col size="10">
        <p class="header_left">FORGOT PASSWORD</p>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col size="12" class="row-spacing">

        <div class="items_center">
          <img src="../../../assets/Images/bg_logo.png" />
        </div>
        <div class="items_center">
          <!--<h4 class="fp-subtitle">Reset Your Password</h4>-->
        </div>
        <br />

        <!-- ── STEP 1: Enter Email ── -->
        <ng-container *ngIf="!forgotOTPFlag">
          <!--<p class="step-label">Step 1: Enter your registered email</p>-->

          <div class="items_center">
            <ion-icon name="mail-outline" class="input_icon"></ion-icon>
            <input type="email"
                   placeholder="Enter your email"
                   [(ngModel)]="forgotEmail"
                   class="input_field" />
          </div>
        </ng-container>

        <!-- ── STEP 2: Enter OTP ── -->
        <ng-container *ngIf="forgotOTPFlag && !forgotOTPVerified">
          <!--<p class="step-label">Step 2: Enter the OTP sent to <strong>{{ forgotEmail }}</strong></p>-->

          <div class="items_center">
            <ion-icon name="keypad-outline" class="input_icon"></ion-icon>
            <input type="text" inputmode="numeric"
                   autocomplete="one-time-code"
                   name="forgot-otp"
                   id="forgot-otp"
                   placeholder="Enter 4-digit OTP"
                   [(ngModel)]="forgotOTP"
                   maxlength="4"
                   class="input_field" />
          </div>

          <div class="items_center" style="margin-top: -4%;">
            <span *ngIf="!forgotCanResend" style="color: gray; font-size: 14px;">Resend OTP in {{ forgotResendTimer }}s</span>
            <span *ngIf="forgotCanResend" class="resend-link" (click)="sendForgotPasswordOTP()">Resend OTP</span>
          </div>
        </ng-container>

        <!-- ── STEP 3: Set New Password ── -->
        <ng-container *ngIf="forgotOTPVerified">
          <!--<p class="step-label">Step 3: Set your new password</p>-->

          <!-- New Password -->
          <div class="items_center">
            <ion-icon name="lock-closed-outline" class="input_icon"></ion-icon>
            <input [type]="showNewPassword ? 'text' : 'password'"
                   placeholder="New Password"
                   [(ngModel)]="newPassword"
                   class="input_field" />
            <ion-icon [name]="showNewPassword ? 'eye-outline' : 'eye-off-outline'"
                      class="eye_icon"
                      (click)="toggleNewPassword()"></ion-icon>
          </div>

          <!-- Confirm Password -->
          <div class="items_center">
            <ion-icon name="lock-closed-outline" class="input_icon"></ion-icon>
            <input [type]="showConfirmPassword ? 'text' : 'password'"
                   placeholder="Confirm Password"
                   [(ngModel)]="confirmPassword"
                   class="input_field" />
            <ion-icon [name]="showConfirmPassword ? 'eye-outline' : 'eye-off-outline'"
                      class="eye_icon"
                      (click)="toggleConfirmPassword()"></ion-icon>
          </div>

          <!-- Password match hint -->
          <div class="items_center" *ngIf="confirmPassword && newPassword !== confirmPassword">
            <span class="pwd-mismatch">Passwords do not match</span>
          </div>
          <div class="items_center" *ngIf="confirmPassword && newPassword === confirmPassword">
            <span class="pwd-match">✓ Passwords match</span>
          </div>
        </ng-container>

      </ion-col>
    </ion-row>

    <!-- Forgot Password Action Buttons -->
    <!-- Step 1: Send OTP -->
    <div class="login-btn-wrapper" *ngIf="!forgotOTPFlag">
      <button class="red-button" (click)="sendForgotPasswordOTP()">Continue</button>
    </div>

    <!-- Step 2: Verify OTP -->
    <div class="login-btn-wrapper" *ngIf="forgotOTPFlag && !forgotOTPVerified">
      <button class="red-button" (click)="verifyForgotOTP()">Verify OTP</button>
    </div>

    <!-- Step 3: Reset Password -->
    <div class="login-btn-wrapper" *ngIf="forgotOTPVerified">
      <button class="red-button" (click)="resetPassword()">Reset Password</button>
    </div>

    <div style="height: 30px;"></div>

  </ng-container>

</ion-content>
